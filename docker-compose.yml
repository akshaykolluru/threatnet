services:
  api:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r backend/requirements.txt && uvicorn api.main:app --host 0.0.0.0 --port 8000 --app-dir backend"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev --workspace web"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
